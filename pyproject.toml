[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-survivor"
version = "0.1.0"
description = "A population of tiny neural nets that paper trade Bitcoin on live keyless market data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Kansal" }]
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.3; python_version >= '3.12'",
    "websockets==17.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
v2news = [
    "anthropic==1.8.0",
    "pydantic==2.13.5",
    "onnxruntime==1.30.0",
    "tokenizers==0.23.2",
]

[project.scripts]
btc_survivor = "btc_survivor.__main__:main"
btc_survivor_v2 = "btc_survivor.v2.__main__:main"

[tool.setuptools.package-data]
btc_survivor = ["dashboard.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The short traceback style never prints the arguments of each frame, so a failure cannot show a secret held in one.
addopts = "-q --tb=short"
