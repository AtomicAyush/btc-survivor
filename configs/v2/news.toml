# The news process, collection and scoring for both stock runs. Settings are fixed before launch, see PLAN_V2 section 15.
# Relative paths are resolved from this folder. Any change after launch alters the news config hash and fails news health.

[news]
kind = "news"
data_dir = "../../data/v2/news"
secrets_file = "~/.config/btc_survivor/secrets.env"
master_seed = 12345                       # report samples
universe = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA", "QQQ"]
schedule_tz = "America/New_York"          # only to pick cadences
http_timeout_seconds = 10
max_response_bytes = 8000000
backlog_gap_seconds = 600                 # added to the longer cadence of the two polls, plus budget waits
backlog_exempt_kinds = ["8k"]
max_vendor_age_hours = 24                 # stale_vendor on both routes
clock_skew_max_seconds = 5
clock_skew_samples = 20
failure_backoff_cap_seconds = 900
heartbeat_seconds = 30
outage_cadence_multiple = 3
outage_floor_seconds = 300
score_wait_seconds = 600                  # or twice the measured burst time if longer
burst_items = 300
keep_filtered_days = 30
keep_polls_days = 14
keep_dups_days = 14
keep_heartbeat_days = 14
rest_lock_file = "~/.config/btc_survivor/finnhub_rest.lock"

[finnhub]
enabled = true
company_symbols = ["AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "TSLA"]
general_category = "general"
max_calls_per_minute = 30                 # key limit 60
min_call_spacing_seconds = 1.1            # key limit 30 a second
regular_window_et = ["09:30", "16:00"]
extended_window_et = ["04:00", "20:00"]
regular_poll_seconds = 60
extended_poll_seconds = 120
overnight_poll_seconds = 600
lookback_days = 1
headline_max_chars = 300
summary_max_chars = 600
rate_limit_pause_seconds = 60
send_to_llm = true                        # the owner's decision of section 13.1, false sends Finnhub items to FinBERT alone

[edgar]
enabled = true
ciks = { AAPL = 320193, MSFT = 789019, NVDA = 1045810, AMZN = 1018724, GOOGL = 1652044, META = 1326801, TSLA = 1318605 }
forms = ["8-K", "8-K/A"]
filing_window_et = ["06:00", "22:00"]
atom_poll_seconds = 30
submissions_poll_seconds = 60
off_window_poll_seconds = 900
max_requests_per_second = 2
max_requests_per_minute = 60
block_pause_seconds = 900
main_doc_max_chars = 4000
exhibit_max_chars = 12000

[fed]
enabled = true
feeds = ["press_all", "press_monetary", "speeches"]
monetary_link_pattern = "/pressreleases/monetary"
press_window_et = ["07:00", "19:00"]
press_poll_seconds = 60
speeches_window_et = ["07:00", "21:00"]
speeches_poll_seconds = 600
speeches_off_hours_poll_seconds = 3600
off_hours_poll_seconds = 900
fomc_fast_window_et = ["13:58", "14:20"]
fomc_fast_poll_seconds = 15
summary_max_chars = 1000
monetary_body_max_chars = 8000
max_requests_per_minute = 10
block_pause_seconds = 900

[bls]
enabled = true
feeds = ["cpi", "empsit", "ppi", "jolts"]
window_et = ["07:00", "19:00"]
poll_seconds = 1800
off_hours_poll_seconds = 7200
release_fast_poll_seconds = 15
release_fast_before_minutes = 1
release_fast_after_minutes = 15
summary_max_chars = 1500
max_requests_per_minute = 10
block_pause_seconds = 900

[dedupe]
hash_window_hours = 24
near_dup_window_hours = 24
near_dup_jaccard = 0.8
near_dup_min_tokens = 4

[prefilter]
macro_strip_pattern = '\b(NASDAQ|NYSE|NYSEARCA)\s*:\s*[A-Z.]+'
alias_excludes_macro = true

[calendar]                                # New York times from 12 Oct 2026 through 31 Mar 2027, polling only
                                          # copied before launch and never changed after it, PLAN_V2 section 16
# FOMC statements. Meeting dates from https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm, read 12 Oct 2026.
# That page gives no time, so each statement takes 2 pm ET from the last one, the 16 Sep 2026 statement released at
# 2 pm EDT by https://www.federalreserve.gov/newsevents/pressreleases/monetary20260916a.htm, read 12 Oct 2026. The
# page calls each 2027 date tentative until the meeting before it confirms it.
fomc_statement = [
    "2026-10-28T14:00",                   # meeting of 27 and 28 Oct 2026
    "2026-12-09T14:00",                   # meeting of 8 and 9 Dec 2026
    "2027-01-27T14:00",                   # meeting of 26 and 27 Jan 2027, tentative on the page
    "2027-03-17T14:00",                   # meeting of 16 and 17 Mar 2027, tentative on the page
]
# BLS releases, each comment naming the reference month. Dates and times from the release schedule pages
# https://www.bls.gov/schedule/news_release/cpi.htm, empsit.htm, ppi.htm and jolts.htm, each read 12 Oct 2026, and
# checked against the monthly pages https://www.bls.gov/schedule/2026/10_sched.htm through 2027/03_sched.htm, read the
# same day. The release pages start at the October 2026 reference month, so each September 2026 release comes from the
# October or November 2026 monthly page and the next release line of https://www.bls.gov/cpi/, https://www.bls.gov/ppi/
# or https://www.bls.gov/jlt/, read 12 Oct 2026.
cpi = [
    "2026-10-14T08:30",                   # September 2026
    "2026-11-10T08:30",                   # October 2026
    "2026-12-10T08:30",                   # November 2026
    "2027-01-13T08:30",                   # December 2026
    "2027-02-11T08:30",                   # January 2027
    "2027-03-10T08:30",                   # February 2027
]
empsit = [                                # the September 2026 release on 2 Oct 2026 came before the window
    "2026-11-06T08:30",                   # October 2026
    "2026-12-04T08:30",                   # November 2026
    "2027-01-08T08:30",                   # December 2026
    "2027-02-05T08:30",                   # January 2027
    "2027-03-05T08:30",                   # February 2027, and March 2027 follows on 2 Apr 2027 after the window
]
ppi = [
    "2026-10-15T08:30",                   # September 2026
    "2026-11-13T08:30",                   # October 2026
    "2026-12-15T08:30",                   # November 2026
    "2027-01-14T08:30",                   # December 2026
    "2027-02-12T08:30",                   # January 2027
    "2027-03-12T08:30",                   # February 2027
]
# JOLTS is unverified after 1 Dec 2026. No BLS page read on 12 Oct 2026 lists a JOLTS release for the November 2026
# reference month or later, and the 2027 monthly pages list none at all, so those releases are left out rather than
# guessed. Dates BLS lists before launch are added then, and none can be added after it.
jolts = [
    "2026-11-03T10:00",                   # September 2026, from 2026/11_sched.htm and the jlt page
    "2026-12-01T10:00",                   # October 2026
]

[llm]                                     # Haiku, on every routed item
enabled = true
model = "claude-haiku-5-5"                # the only accepted value
effort = "low"                            # the only accepted value
thinking = "disabled"                     # the only accepted value
scorer_name = "haiku_v1"
prompt_file = "prompt_v2.txt"
prompt_sha256 = "e69bb9a9c6ba328094b71cb5ffd8f54718942b4b175d4bad85a4bd6daf058417"   # pinned at build
schema_file = "schema_v2.json"
schema_sha256 = "c2fcd2cee2da72d5d177c79fef86d2070fa997c2066d18dd9c2630cacd99e81f"   # pinned at build
request_timeout_seconds = 60
max_tokens = 4096
flush_max_items = 20
flush_after_seconds = 60
max_items_per_call = 25
long_form_kinds = ["8k", "fed_monetary"]
alone_kinds = ["8k", "fed_press", "fed_monetary", "fed_speech", "bls_release"]   # one item per call
max_queue_age_seconds = 300
headline_max_chars = 300
text_max_chars = 700
long_form_max_chars = 24000
max_input_tokens = 20000                  # exact count, or bytes over 3 without one
max_calls_per_batch = 24
max_requeues = 1                          # a missing item only, never a failed call
rate_limit_pause_minutes = 15
refusal_pause_share = 0.2
refusal_window_calls = 50
probe_file = "probes_v2.json"
probe_time_utc = "06:00"
probe_alert_direction_agreement = 0.8     # probes run on Haiku only

[llm.sonnet]                              # the comparison scorer, official items only
enabled = true                            # on since 13 Oct 2026, after the live call of section 8.1
model = "claude-sonnet-5-5"               # the only accepted value, and Opus is never accepted
effort = "low"                            # the only accepted value
thinking = "between_tools"                # the live call of 13 Oct 2026 refused disabled with a 400 and passed
                                          # between_tools with 0 thinking tokens used, so Sonnet reasons no more than Haiku
scorer_name = "sonnet_v1"
kinds = ["8k", "fed_press", "fed_monetary", "fed_speech", "bls_release"]
max_tokens = 1024                         # one item with up to 10 impacts
thinking_tokens = 1024                    # room added to max_tokens for thinking, reserved and booked as output, 0
                                          # exactly while thinking is disabled, 1024 for between_tools, 4096 adaptive
cache_control = false                    # Sonnet cache prices are not in the research

[llm.caps]                                # one ledger and one cap for both models
ledger_file = "~/.config/btc_survivor/llm_ledger.db"
ledger_lock_file = "~/.config/btc_survivor/llm_ledger.lock"
monthly_usd = 20.00                       # equal to the Console workspace limit, and no daily cap
daily_alert_share = 0.25                  # a warning above 5 dollars in one UTC day, never a stop
reserve_overhead_tokens = 1000            # the byte bound overhead, and the margin reserved over an exact count

[llm.prices]                              # Anthropic pricing page, read 11 Oct 2026
haiku_input_per_mtok = 0.10
haiku_output_per_mtok = 0.50
haiku_cache_write_multiplier = 1.25
haiku_cache_read_multiplier = 0.10
sonnet_input_per_mtok = 2.00
sonnet_output_per_mtok = 10.00
long_prompt_threshold_tokens = 100000     # Haiku, never reached under the 20,000 token guard

[finbert]
model_file = "../../data/models/finbert/model.onnx"
model_sha256 = "637d6c68660e94116f8c067621e8f0c448b00a3d1343d66c96a7dd84220aae68"  # pinned at export, 13 Oct 2026
tokenizer_file = "../../data/models/finbert/tokenizer.json"
tokenizer_sha256 = "d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66"
manifest_file = "../../data/models/finbert/manifest.json"
source_revision = "4556d13015211d73dccd3fdd39d39232506f3e43"  # the pinned commit of ProsusAI/finbert
window_tokens = 510
max_windows = 16
threads = 1
